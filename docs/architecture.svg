<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How Loopable works</title>
<desc id="d">GitHub, Slack, Lark, Gmail and the clock start work in Loopable, which is hosted. A runner on your machine pulls the job and runs Codex or Claude Code. Loopable writes the answer back where it was asked, and keeps every run in the Inbox.</desc>
<rect width="960" height="600" rx="24" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="959" height="599" rx="24" fill="none" stroke="#e5e5e5"/>
<text x="480.0" y="48" font-size="11" font-weight="600" fill="#737373" text-anchor="middle" letter-spacing="0.08em">COMES IN FROM</text>
<rect x="243.2" y="62" width="77.6" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="282.0" y="83" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">GitHub</text>
<rect x="330.8" y="62" width="100.4" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="381.0" y="83" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">Slack bot</text>
<rect x="441.2" y="62" width="92.8" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="487.6" y="83" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">Lark bot</text>
<rect x="544.0" y="62" width="70.0" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="579.0" y="83" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">Gmail</text>
<rect x="624.0" y="62" width="92.8" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="670.4" y="83" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">Schedule</text>
<line x1="480.0" y1="100" x2="480.0" y2="134" stroke="#171717" stroke-width="1.5"/>
<path d="M475.0 132 L480.0 140 L485.0 132" fill="none" stroke="#171717" stroke-width="1.5"/>
<text x="494.0" y="124.0" font-size="12" font-weight="500" fill="#737373" text-anchor="start" letter-spacing="0.02em">something new: a review request, a mention, an email, the time</text>
<rect x="60" y="140" width="840" height="150" rx="16" fill="#fafafa" stroke="#e5e5e5"/>
<text x="84" y="178" font-size="20" font-weight="600" fill="#171717" letter-spacing="-0.01em">Loopable</text>
<text x="876" y="176" font-size="11" font-weight="600" fill="#737373" text-anchor="end" letter-spacing="0.08em">HOSTED · LOOP.GOODONE.SI</text>
<rect x="84.0" y="198" width="256.0" height="72" rx="10" fill="#fff" stroke="#e5e5e5"/>
<text x="98.0" y="220" font-size="13" font-weight="600" fill="#171717">1 · Watch</text>
<text x="98.0" y="240" font-size="13" fill="#737373">Looks at your services</text>
<text x="98.0" y="258" font-size="13" fill="#737373">for something new.</text>
<rect x="352.0" y="198" width="256.0" height="72" rx="10" fill="#fff" stroke="#e5e5e5"/>
<text x="366.0" y="220" font-size="13" font-weight="600" fill="#171717">2 · Match</text>
<text x="366.0" y="240" font-size="13" fill="#737373">Picks the first loop</text>
<text x="366.0" y="258" font-size="13" fill="#737373">that fits.</text>
<rect x="620.0" y="198" width="256.0" height="72" rx="10" fill="#fff" stroke="#e5e5e5"/>
<text x="634.0" y="220" font-size="13" font-weight="600" fill="#171717">3 · Queue</text>
<text x="634.0" y="240" font-size="13" fill="#737373">Holds the job</text>
<text x="634.0" y="258" font-size="13" fill="#737373">until a runner takes it.</text>
<line x1="480.0" y1="290" x2="480.0" y2="328" stroke="#171717" stroke-width="1.5"/>
<path d="M475.0 326 L480.0 334 L485.0 326" fill="none" stroke="#171717" stroke-width="1.5"/>
<text x="494.0" y="316.0" font-size="12" font-weight="500" fill="#737373" text-anchor="start" letter-spacing="0.02em">your runner pulls the job over HTTPS</text>
<rect x="60" y="334" width="840" height="118" rx="16" fill="#171717"/>
<text x="84" y="372" font-size="20" font-weight="600" fill="#fff" letter-spacing="-0.01em">Runner</text>
<text x="876" y="370" font-size="11" font-weight="600" fill="#a3a3a3" text-anchor="end" letter-spacing="0.08em">YOUR MACHINE</text>
<text x="84" y="400" font-size="14" fill="#d4d4d4">Runs your agent with your code, your tools and your logins.</text>
<rect x="84" y="414" width="70.0" height="26" rx="13" fill="none" stroke="#525252"/>
<text x="119.0" y="431" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Codex</text>
<rect x="162.0" y="414" width="115.6" height="26" rx="13" fill="none" stroke="#525252"/>
<text x="219.8" y="431" font-size="12.5" font-weight="500" fill="#fff" text-anchor="middle">Claude Code</text>
<line x1="480.0" y1="452" x2="480.0" y2="490" stroke="#171717" stroke-width="1.5"/>
<path d="M475.0 488 L480.0 496 L485.0 488" fill="none" stroke="#171717" stroke-width="1.5"/>
<text x="494.0" y="478.0" font-size="12" font-weight="500" fill="#737373" text-anchor="start" letter-spacing="0.02em">Loopable writes the answer back</text>
<text x="480.0" y="522" font-size="11" font-weight="600" fill="#737373" text-anchor="middle" letter-spacing="0.08em">WHERE IT WAS ASKED</text>
<rect x="184.4" y="536" width="176.4" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="272.6" y="557" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">A review or comment</text>
<rect x="370.8" y="536" width="191.6" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="466.6" y="557" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">A reply in the thread</text>
<rect x="572.4" y="536" width="92.8" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="618.8" y="557" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">An email</text>
<rect x="675.2" y="536" width="100.4" height="32" rx="16" fill="#fff" stroke="#e5e5e5"/>
<text x="725.4" y="557" font-size="13" font-weight="500" fill="#171717" text-anchor="middle">The Inbox</text>
</svg>
