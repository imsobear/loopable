  <rect width="920" height="720" rx="24" fill="#070708"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#f2eee6">
    <g id="connectors" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">
      <g transform="translate(214 36)">
        <rect width="150" height="36" rx="18" fill="none" stroke="rgba(242,238,230,0.14)"/>
        <use href="#i-slack" x="16" y="10" width="16" height="16"/>
        <text x="40" y="23">SLACK BOT</text>
      </g>
      <g transform="translate(385 36)">
        <rect width="150" height="36" rx="18" fill="none" stroke="rgba(242,238,230,0.14)"/>
        <use href="#i-github" x="28" y="10" width="16" height="16"/>
        <text x="52" y="23">GITHUB</text>
      </g>
      <g transform="translate(556 36)">
        <rect width="150" height="36" rx="18" fill="none" stroke="rgba(242,238,230,0.14)"/>
        <use href="#i-lark" x="22" y="10" width="16" height="16"/>
        <text x="46" y="23">LARK BOT</text>
      </g>
    </g>

    <path d="M460 80 v36" stroke="#d4ff3f" stroke-width="1.2" opacity="0.85"/>

    <g transform="translate(80 132)">
      <rect width="760" height="214" rx="16" fill="#0c0d10" stroke="rgba(212,255,63,0.22)"/>
      <text x="28" y="36" font-size="22" font-weight="560" letter-spacing="-0.4">Loopable</text>
      <text x="732" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#9b968c">APP + DISPATCHER</text>

      <g transform="translate(20 58)" font-size="15">
        <rect width="720" height="134" rx="12" fill="none" stroke="rgba(242,238,230,0.1)"/>
        <g transform="translate(0 0)">
          <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#d4ff3f">WATCH</text>
          <text x="24" y="58">From Slack, GitHub, Lark.</text>
          <text x="24" y="80" font-size="13" fill="#9b968c">The tools the team already uses.</text>
        </g>
        <path d="M240 1 v132" stroke="rgba(242,238,230,0.1)"/>
        <path d="M229 22h10l-4 4" fill="none" stroke="#d4ff3f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(240 0)">
          <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#d4ff3f">MATCH</text>
          <text x="24" y="58">Pick the loop.</text>
          <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1" fill="#9b968c">
            <rect x="24" y="70" width="64" height="22" rx="11" fill="none" stroke="rgba(242,238,230,0.12)"/>
            <text x="56" y="85" text-anchor="middle">REVIEW</text>
            <rect x="94" y="70" width="56" height="22" rx="11" fill="none" stroke="rgba(242,238,230,0.12)"/>
            <text x="122" y="85" text-anchor="middle">CASES</text>
            <rect x="156" y="70" width="72" height="22" rx="11" fill="none" stroke="rgba(242,238,230,0.12)"/>
            <text x="192" y="85" text-anchor="middle">MONITORS</text>
          </g>
        </g>
        <path d="M480 1 v132" stroke="rgba(242,238,230,0.1)"/>
        <path d="M469 22h10l-4 4" fill="none" stroke="#d4ff3f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(480 0)">
          <text x="24" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#d4ff3f">DISPATCH</text>
          <text x="24" y="58">Queue the job.</text>
          <text x="24" y="80" font-size="13" fill="#9b968c">A runner pulls it.</text>
        </g>
      </g>
    </g>

    <path d="M460 346 v36" stroke="#d4ff3f" stroke-width="1.2" opacity="0.85"/>
    <text x="472" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#d4ff3f">PULL</text>

    <g transform="translate(80 398)">
      <rect width="760" height="132" rx="16" fill="#0c0d10" stroke="rgba(242,238,230,0.1)"/>
      <text x="28" y="36" font-size="22" font-weight="560" letter-spacing="-0.4">Runner</text>
      <text x="732" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#9b968c">SHARED COMPUTER</text>
      <text x="28" y="64" font-size="15" fill="#9b968c">Pulls the job. Codex or Claude run on that machine. Loopable writes the result back.</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">
        <g transform="translate(28 84)">
          <rect width="110" height="32" rx="16" fill="none" stroke="rgba(242,238,230,0.14)"/>
          <use href="#i-codex" x="14" y="8" width="16" height="16"/>
          <text x="36" y="21">CODEX</text>
        </g>
        <g transform="translate(148 84)">
          <rect width="118" height="32" rx="16" fill="none" stroke="rgba(242,238,230,0.14)"/>
          <use href="#i-claude" x="14" y="8" width="16" height="16"/>
          <text x="36" y="21">CLAUDE</text>
        </g>
      </g>
    </g>

    <path d="M460 530 v36" stroke="#d4ff3f" stroke-width="1.2" opacity="0.85"/>
    <text x="472" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#d4ff3f">WRITE BACK</text>

    <use href="#connectors" y="548"/>
  </g>
</svg>
