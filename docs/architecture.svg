<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
  <title id="title">Loopable architecture</title>
  <desc id="desc">Slack bot, GitHub, and Lark bot into Loopable. A runner pulls the job. Loopable writes the result back to Slack, GitHub, and Lark.</desc>
