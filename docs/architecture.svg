    <symbol id="i-codex" viewBox="0 0 24 24">
      <path fill="none" stroke="#f2eee6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8.2 7.2 3.8 12l4.4 4.8M15.8 7.2 20.2 12l-4.4 4.8"/>
    </symbol>
    <symbol id="i-claude" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 1.8 13.2 8.5 19.4 5.1 15.5 10.5 22.2 12 15.5 13.5 19.4 18.9 13.2 15.5 12 22.2 10.8 15.5 4.6 18.9 8.5 13.5 1.8 12 8.5 10.5 4.6 5.1 10.8 8.5Z"/>
