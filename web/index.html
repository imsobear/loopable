<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loopable</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --card: #fff;
      --accent: #1d4ed8;
      --warn: #b45309;
      --ok: #047857;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 20px 28px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 650; }
    header span { color: var(--muted); font-size: 13px; }
    nav { display: flex; gap: 16px; padding: 0 28px; background: var(--card); border-bottom: 1px solid var(--line); }
    nav button {
      background: none; border: 0; padding: 12px 0; color: var(--muted);
      border-bottom: 2px solid transparent; cursor: pointer; font: inherit;
    }
    nav button.active { color: var(--ink); border-bottom-color: var(--ink); }
    main { padding: 20px 28px 48px; max-width: 920px; }
    .row { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .pill {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e7e5e4;
    }
    .pill.needs_approval { background: #fef3c7; color: var(--warn); }
    .pill.queued, .pill.running, .pill.preparing { background: #dbeafe; color: var(--accent); }
    .pill.completed { background: #d1fae5; color: var(--ok); }
    .pill.failed, .pill.cancelled { background: #fee2e2; color: var(--bad); }
    button.primary, button.ghost, a.primary {
      border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit;
    }
    button.primary, a.primary { background: var(--ink); color: #fff; border: 0; }
    button.ghost { background: #fff; border: 1px solid var(--line); }
    a.primary { display: inline-block; text-decoration: none; line-height: 1.2; }
    button.card {
      display: block; width: 100%; text-align: left; font: inherit; color: inherit;
      cursor: pointer;
    }
    textarea, input[type=password], input[type=text] {
      width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff;
    }
    pre {
      white-space: pre-wrap;
      background: #fafaf9;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }
    .error { color: var(--bad); }
  </style>
</head>
<body>
  <header>
    <h1>Loopable</h1>
    <span id="status">Checking…</span>
  </header>
  <nav>
    <button class="active" data-view="inbox">Inbox</button>
    <button data-view="rules">Rules</button>
    <button data-view="setup">Setup</button>
  </nav>
  <main id="app"></main>
  <script>
    const app = document.getElementById("app");
    let view = "inbox";
    let selected = null;
    const boot = new URLSearchParams(location.search);
    if (boot.get("connected") === "1" || boot.get("github_error")) view = "setup";

    document.querySelectorAll("nav button").forEach((b) => {
      b.classList.toggle("active", b.dataset.view === view);
      b.onclick = () => {
        document.querySelectorAll("nav button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        view = b.dataset.view;
        selected = null;
        render();
      };
    });

    async function api(path, opt) {
      const res = await fetch(path, opt);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function refreshStatus() {
      try {
        const s = await api("/api/status");
        document.getElementById("status").textContent = s.github
          ? `GitHub connected${s.login ? " as @" + s.login : ""} · poll ~60s`
          : "GitHub not connected · poll idle";
      } catch (e) {
        document.getElementById("status").textContent = e.message;
      }
    }

    async function render() {
      await refreshStatus();
      if (view === "inbox") return renderInbox();
      if (view === "rules") return renderRules();
      return renderSetup();
    }

    async function renderInbox() {
      if (selected) return renderRun(selected);
      const { runs } = await api("/api/inbox");
      app.innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <div>
            <h2 style="margin:0">Inbox</h2>
            <p class="muted">Prepared locally. Nothing is posted to GitHub until you approve.</p>
          </div>
          <button class="ghost" id="poll">Poll GitHub now</button>
        </div>
        ${runs.length === 0 ? `<p class="muted">No runs yet. Connect GitHub, or wait for a review request.</p>` : ""}
        ${runs.map((r) => `
          <button class="card" data-id="${r.id}">
            <div class="row">
              <strong>${escapeHtml(r.title || r.work_item_id)}</strong>
              <span class="pill ${r.state}">${r.state}${r.outcome ? " · " + r.outcome : ""}</span>
            </div>
            <div class="muted">${escapeHtml(r.repository || "")} · ${escapeHtml(r.action_type)} · ${escapeHtml(r.event_type || "")}</div>
          </button>
        `).join("")}
      `;
      document.getElementById("poll").onclick = async () => {
        try {
          await api("/api/poll", { method: "POST" });
          render();
        } catch (e) { alert(e.message); }
      };
      app.querySelectorAll(".card[data-id]").forEach((el) => {
        el.onclick = () => { selected = el.dataset.id; render(); };
      });
    }

    async function renderRun(id) {
      const { run, ops, event } = await api("/api/runs/" + id);
      const pending = (ops || []).find((o) => o.status === "pending");
      const op = pending ? JSON.parse(pending.op_json) : null;
      app.innerHTML = `
        <p><button class="ghost" id="back">Back</button></p>
        <h2 style="margin-top:0">${escapeHtml(run.action_type)}</h2>
        <p class="muted">${escapeHtml(run.work_item_id)} · <span class="pill ${run.state}">${run.state}${run.outcome ? " · " + run.outcome : ""}</span></p>
        ${op ? `<h3>Proposed GitHub write</h3><p class="muted">${escapeHtml(op.type)}</p><pre>${escapeHtml(op.body || "")}</pre>` : `<p class="muted">${escapeHtml(run.summary || "No proposal yet.")}</p>`}
        ${run.state === "needs_approval" ? `
          <div class="row">
            <button class="primary" id="approve">Approve and publish</button>
            <button class="ghost" id="reject">Reject</button>
          </div>
        ` : ""}
        ${run.state === "failed" ? `<p class="error">${escapeHtml(run.summary || "failed")}</p>` : ""}
      `;
      document.getElementById("back").onclick = () => { selected = null; render(); };
      const approve = document.getElementById("approve");
      const reject = document.getElementById("reject");
      if (approve) approve.onclick = async () => {
        try { await api("/api/runs/" + id + "/approve", { method: "POST" }); render(); }
        catch (e) { alert(e.message); }
      };
      if (reject) reject.onclick = async () => {
        try { await api("/api/runs/" + id + "/reject", { method: "POST" }); render(); }
        catch (e) { alert(e.message); }
      };
    }

    async function renderRules() {
      const { rules } = await api("/api/rules");
      app.innerHTML = `<h2>Rules</h2>
        <p class="muted">Typed actions. Extra instructions are optional. Publishing always needs approval.</p>
        ${rules.map((r) => `
          <div class="card">
            <div class="row"><strong>${escapeHtml(r.name)}</strong><span class="pill">${r.enabled ? "on" : "off"}</span></div>
            <div class="muted">${escapeHtml(r.trigger.event)} → ${escapeHtml(r.action.type)} → ${escapeHtml(r.execution.runner)}</div>
            <p class="muted">${escapeHtml(r.action.instructions || "")}</p>
          </div>
        `).join("")}`;
    }

    async function renderSetup() {
      const s = await api("/api/status");
      const err = new URLSearchParams(location.search).get("github_error");
      app.innerHTML = `
        <h2>Setup</h2>
        <p class="muted">This UI is only on 127.0.0.1. The token stays in macOS Keychain, not SQLite.</p>
        ${err ? `<p class="error">${escapeHtml(err)}</p>` : ""}
        <div class="card" id="github-card"></div>
        <p class="muted">Need a review card without GitHub? Run <code>node --experimental-strip-types src/cli.ts demo</code>, then click Poll GitHub now.</p>
      `;
      const card = document.getElementById("github-card");
      if (s.github) {
        card.innerHTML = `
          <p>Connected${s.login ? " as <strong>@" + escapeHtml(s.login) + "</strong>" : ""}.</p>
          <button class="ghost" id="disconnect">Disconnect GitHub</button>
        `;
        document.getElementById("disconnect").onclick = async () => {
          try {
            await api("/api/github/disconnect", { method: "POST" });
            history.replaceState({}, "", "/");
            render();
          } catch (e) { alert(e.message); }
        };
        return;
      }
      if (!s.oauthApp) {
        card.innerHTML = `
          <p class="error">This build is missing its GitHub app registration.</p>
          <p class="muted">Developer step, not something a user should do: copy <code>config/oauth-app.example.json</code> to <code>config/oauth-app.json</code> with the client ID and secret of the Loopable app, using callback URL <code>${escapeHtml(s.callbackUrl)}</code>.</p>
        `;
        return;
      }
      card.innerHTML = `
        <p class="muted">You will go to GitHub, click Authorize, and come back signed in. Nothing is posted until you approve a run in the inbox.</p>
        <p><a class="primary" href="/oauth/github/start">Authorize GitHub</a></p>
      `;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    render();
    setInterval(() => { if (view === "inbox" && !selected) render(); }, 4000);
  </script>
</body>
</html>
