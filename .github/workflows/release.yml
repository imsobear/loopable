name: Release

# Publishes loopable-cli to npm: the version package.json says, once that
# commit is live. The version is bumped in a pull request like any other
# change (pnpm bump minor), so this never pushes to main; it adds the tag.
#
# Runs by itself after Deploy finishes a merge to main. A commit whose version
# is already on npm is a service-only change, and is left alone. Run it by hand
# from the Actions tab to publish main again after a failed release.
#
# npm trusts this workflow directly (trusted publishing), so there is no npm
# token anywhere. Set up once on npmjs.com: loopable-cli → Settings → Trusted
# publishing → GitHub Actions, repository imsobear/loopable, workflow release.yml.
# Keep the file name: npm trusts this file, not whatever runs under its name.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  check:
    # After Deploy only when it deployed a merge. A Deploy run by hand may be a
    # rollback to an older commit, and that is not a new version.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      # After Deploy, the run that triggered this is the proof. By hand, main
      # has to be what the last deploy put out.
      - name: Check the commit is what is deployed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(git rev-parse HEAD)"
          live="$(gh run list --workflow deploy.yml --status success --limit 1 --json headSha -q '.[0].headSha')"
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "$head" != "$live" ]; then
            echo "This is $head but the last successful deploy was $live." >&2
            echo "Wait for the deploy of main to finish, or run Deploy, then release." >&2
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"

      - name: Check the version is new
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "loopable-cli@$version" version >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then
              echo "loopable-cli@$version is already on npm. Bump it in a pull request first: pnpm bump minor" >&2
              exit 1
            fi
            echo "loopable-cli@$version is already on npm, so there is nothing to release."
            exit 0
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "The tag v$version already exists." >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The checks above already ran, so publish skips prepublishOnly.
      - run: npm publish --ignore-scripts

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.check.outputs.tag }}" -m "Release ${{ needs.check.outputs.tag }}."
          git push origin "${{ needs.check.outputs.tag }}"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.check.outputs.tag }}" --generate-notes
