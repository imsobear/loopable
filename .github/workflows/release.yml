name: Release

# Publishes loopable-cli to npm: the version main's package.json says, once
# that commit is live. The version is bumped in a pull request like any other
# change (pnpm bump minor), so this never pushes to main; it adds the tag.
# Run by hand from the Actions tab.
#
# npm trusts this workflow directly (trusted publishing), so there is no npm
# token anywhere. Set up once on npmjs.com: loopable-cli → Settings → Trusted
# publishing → GitHub Actions, repository imsobear/loopable, workflow release.yml.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check main is what is deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(git rev-parse HEAD)"
          live="$(gh run list --workflow deploy.yml --status success --limit 1 --json headSha -q '.[0].headSha')"
          if [ "$head" != "$live" ]; then
            echo "main is at $head but the last successful deploy was $live." >&2
            echo "Wait for the deploy of main to finish, or run Deploy, then release." >&2
            exit 1
          fi

      - name: Check the version is new
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "loopable-cli@$version" version >/dev/null 2>&1; then
            echo "loopable-cli@$version is already on npm. Bump it in a pull request first: pnpm bump minor" >&2
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "The tag v$version already exists." >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The checks above already ran, so publish skips prepublishOnly.
      - run: npm publish --ignore-scripts

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}."
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
